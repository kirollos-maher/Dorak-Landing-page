<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DORAK — تغيير كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0c0f12;
      color: #eef1f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(600px 400px at 80% 20%, rgba(255, 138, 30, 0.10), transparent 60%);
      padding: 20px;
    }
    .reset-card {
      background: #14181d;
      border: 1px solid #262c33;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }
    .reset-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 138, 30, 0.06), transparent 50%);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .02em;
      margin-bottom: 32px;
      color: #eef1f4;
    }
    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff8a1e;
      box-shadow: 0 0 0 4px rgba(255, 138, 30, 0.12);
    }
    .brand .mark {
      font-family: 'JetBrains Mono', monospace;
      color: #ff8a1e;
    }
    .reset-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .reset-card .sub { color: #8b95a1; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #8b95a1;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: #0c0f12;
      border: 1px solid #262c33;
      border-radius: 10px;
      padding: 14px 16px;
      color: #eef1f4;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ff8a1e;
      box-shadow: 0 0 0 3px rgba(255, 138, 30, 0.15);
    }
    .btn-reset {
      width: 100%;
      background: #ff8a1e;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-weight: 800;
      font-size: 16px;
      color: #12100c;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(255, 138, 30, 0.3);
      margin-top: 6px;
    }
    .btn-reset:hover { background: #f57c0a; box-shadow: 0 8px 28px rgba(255, 138, 30, 0.5); }
    .btn-reset:active { transform: scale(0.97); }
    .reset-footer {
      display: flex;
      justify-content: center;
      margin-top: 18px;
      font-size: 14px;
    }
    .reset-footer a { color: #ff8a1e; font-weight: 700; text-decoration: none; }
    .reset-footer a:hover { text-decoration: underline; }
    .legal {
      margin-top: 28px;
      font-size: 11.5px;
      color: #565f6a;
      text-align: center;
      line-height: 1.6;
      border-top: 1px solid #1e242b;
      padding-top: 22px;
    }
    .legal .brand-tag { color: #ff8a1e; font-weight: 700; }
    .footer-note {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      font-size: 11px;
      color: #3a424c;
      gap: 14px;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }
    .success-msg {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #22c55e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }
    @media (max-width: 480px) {
      .reset-card { padding: 32px 20px; }
      .brand { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="reset-card">
  <div class="brand">
    <span class="dot"></span>
    DORAK <span class="mark">✦</span>
  </div>
  
  <h2>تغيير كلمة المرور</h2>
  <p class="sub">أدخل بريدك الإلكتروني وكلمة المرور الجديدة</p>

  <form id="resetForm" onsubmit="return handleReset(event)">
    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="name@example.com" required />
    </div>
    <div class="form-group">
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" />
    </div>
    <div class="form-group">
      <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" required />
    </div>
    <div id="resetError" class="error-msg"></div>
    <div id="resetSuccess" class="success-msg"></div>
    <button type="submit" class="btn-reset"><i class="fa-solid fa-key"></i> تغيير كلمة المرور</button>
  </form>

  <div class="reset-footer">
    <a href="login.html">تذكرت كلمة المرور؟ سجل الدخول</a>
  </div>

  <div class="legal">
    <strong>DORAK</strong> — نظام إدارة صالات البلايستيشن والجيمنج.<br />
    <span class="brand-tag">دورك</span> مش تابع لأي شركة ألعاب خارجية.
  </div>
  <div class="footer-note">
    <span>© 2026 DORAK</span>
    <span>نظام إدارة صالات البلايستيشن والجيمنج</span>
  </div>
</div>

<script>
  function getUsers() {
    return JSON.parse(localStorage.getItem('dorak_users') || '[]');
  }

  function saveUsers(users) {
    localStorage.setItem('dorak_users', JSON.stringify(users));
  }

  function handleReset(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('resetError');
    const successEl = document.getElementById('resetSuccess');
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    if (!email || !newPassword || !confirm) {
      errorEl.textContent = 'يرجى ملء جميع الحقول.';
      errorEl.style.display = 'block';
      return false;
    }

    if (newPassword.length < 6) {
      errorEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
      errorEl.style.display = 'block';
      return false;
    }

    if (newPassword !== confirm) {
      errorEl.textContent = 'كلمة المرور وتأكيدها غير متطابقين.';
      errorEl.style.display = 'block';
      return false;
    }

    let users = getUsers();
    const userIndex = users.findIndex(u => u.email === email);

    if (userIndex === -1) {
      errorEl.textContent = 'لا يوجد حساب مسجل بهذا البريد الإلكتروني.';
      errorEl.style.display = 'block';
      return false;
    }

    users[userIndex].password = newPassword;
    saveUsers(users);

    successEl.textContent = '✅ تم تغيير كلمة المرور بنجاح! جاري تحويلك لتسجيل الدخول...';
    successEl.style.display = 'block';

    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1500);

    return false;
  }

  window.onload = function() {
    if (localStorage.getItem('dorak_user')) {
      window.location.href = 'dashboard.html';
    }
  };
</script>

</body>
</html>
