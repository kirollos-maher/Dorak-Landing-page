<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DORAK — لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0c0f12;
      color: #eef1f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(600px 400px at 80% 20%, rgba(255, 138, 30, 0.10), transparent 60%);
      padding: 20px;
    }
    .dashboard-card {
      background: #14181d;
      border: 1px solid #262c33;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 138, 30, 0.06), transparent 50%);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .02em;
      margin-bottom: 32px;
      color: #eef1f4;
    }
    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff8a1e;
      box-shadow: 0 0 0 4px rgba(255, 138, 30, 0.12);
    }
    .brand .mark {
      font-family: 'JetBrains Mono', monospace;
      color: #ff8a1e;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #262c33;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      color: #ff8a1e;
      border: 2px solid #ff8a1e;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dashboard-card h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .dashboard-card .email {
      color: #8b95a1;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .dashboard-card .badge {
      display: inline-block;
      background: rgba(45, 212, 191, 0.15);
      color: #2dd4bf;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .btn-logout {
      width: 100%;
      background: transparent;
      border: 1px solid #ef4444;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #ef4444;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-top: 10px;
    }
    .btn-logout:hover {
      background: #ef4444;
      color: #0c0f12;
    }
    .btn-home {
      width: 100%;
      background: #ff8a1e;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #12100c;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .btn-home:hover {
      background: #f57c0a;
    }
    .btn-trial {
      width: 100%;
      background: transparent;
      border: 2px solid #22c55e;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #22c55e;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .btn-trial:hover {
      background: #22c55e;
      color: #0c0f12;
    }
    .btn-trial:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .activation-info {
      background: #0c0f12;
      border: 1px solid #262c33;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      text-align: right;
    }
    .activation-info .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #ff8a1e;
      letter-spacing: 1px;
      background: #14181d;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
    }
    .activation-info .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-active { background: rgba(45, 212, 191, 0.15); color: #2dd4bf; }
    .status-expired { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .status-pending { background: rgba(255, 138, 30, 0.15); color: #ff8a1e; }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #3a424c;
      border-top: 1px solid #1e242b;
      padding-top: 18px;
    }
    .footer-note a { color: #565f6a; text-decoration: none; }
    .footer-note a:hover { color: #8b95a1; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13.5px;
      text-align: center;
      z-index: 999;
      display: none;
      color: #fff;
    }
    .toast.success { background: #16825a; }
    .toast.error { background: #b3261e; }
    .toast.warning { background: #b36b1e; }
    @media (max-width: 480px) {
      .dashboard-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<div class="dashboard-card" id="dashboardCard">
  <div class="brand">
    <span class="dot"></span>
    DORAK <span class="mark">✦</span>
  </div>

  <div class="avatar" id="avatarContainer">
    <i class="fa-regular fa-user"></i>
  </div>

  <h2 id="userName">مرحباً بك!</h2>
  <p class="email" id="userEmail">example@email.com</p>
  <div class="badge">✅ تم تسجيل الدخول بنجاح</div>

  <div id="activationSection" style="display:none;">
    <div class="activation-info" id="activationInfo">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
        <span>🔑 كود التفعيل:</span>
        <span class="code" id="activationCodeDisplay">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:8px;">
        <span>📅 الحالة:</span>
        <span class="status" id="activationStatusDisplay">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--text-dim);">
        <span>⏳ يتبقى:</span>
        <span id="activationRemainingDisplay">—</span>
      </div>
    </div>
  </div>

  <button class="btn-trial" id="trialBtn" onclick="requestTrial()">
    <i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)
  </button>

  <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> العودة للصفحة الرئيسية</a>

  <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>

  <div class="footer-note">
    <span>© 2026 DORAK — نظام إدارة صالات البلايستيشن والجيمنج</span>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const SUPABASE_URL = 'https://hdrvqgicxxgfolozxgjp.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_dGNw7eTTempKBdFmAZRjYA_eaeEE2jj';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + type;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 3000);
  }

  function logout() {
    localStorage.removeItem('dorak_user');
    window.location.href = 'login.html';
  }

  function generateActivationCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'DORAK-';
    for (let i = 0; i < 12; i++) {
      if (i > 0 && i % 4 === 0) code += '-';
      code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
  }

  async function requestTrial() {
    const btn = document.getElementById('trialBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الطلب...';

    try {
      const userData = localStorage.getItem('dorak_user');
      if (!userData) {
        showToast('❌ يجب تسجيل الدخول أولاً.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';
        return;
      }

      const user = JSON.parse(userData);
      const userEmail = user.email;

      const { data: existing, error: checkError } = await supabase
        .from('activation_requests')
        .select('*')
        .eq('user_email', userEmail)
        .order('created_at', { ascending: false })
        .limit(1);

      if (checkError) {
        showToast('⚠️ خطأ في التحقق: ' + checkError.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';
        return;
      }

      if (existing && existing.length > 0) {
        const last = existing[0];
        const now = new Date();
        const expiry = new Date(last.expiry_date);

        if (last.status === 'active' && expiry > now) {
          showToast('✅ لديك اشتراك مفعّل بالفعل!', 'warning');
          loadActivationStatus();
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';
          return;
        }

        if (last.status === 'pending') {
          showToast('⏳ طلبك قيد المراجعة، انتظر قليلاً.', 'warning');
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';
          return;
        }

        if (last.status === 'expired' || expiry <= now) {
          await supabase
            .from('activation_requests')
            .update({ status: 'expired' })
            .eq('id', last.id);
        }
      }

      const newCode = generateActivationCode();
      const expiryDate = new Date();
      expiryDate.setDate(expiryDate.getDate() + 7);

      const { data: insertData, error: insertError } = await supabase
        .from('activation_requests')
        .insert({
          user_email: userEmail,
          user_name: user.name || 'مستخدم',
          activation_code: newCode,
          status: 'pending',
          expiry_date: expiryDate.toISOString(),
          device_id: null
        })
        .select();

      if (insertError) {
        showToast('❌ فشل إنشاء الكود: ' + insertError.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';
        return;
      }

      showToast('✅ تم إنشاء كود التفعيل! يرجى الانتظار حتى يتم تفعيله.', 'success');
      loadActivationStatus();
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';

    } catch (e) {
      showToast('❌ حدث خطأ: ' + e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية (7 أيام)';
    }
  }

  async function loadActivationStatus() {
    try {
      const userData = localStorage.getItem('dorak_user');
      if (!userData) return;

      const user = JSON.parse(userData);
      const userEmail = user.email;

      const { data, error } = await supabase
        .from('activation_requests')
        .select('*')
        .eq('user_email', userEmail)
        .order('created_at', { ascending: false })
        .limit(1);

      if (error) {
        console.error('خطأ في تحميل حالة التفعيل:', error);
        return;
      }

      if (data && data.length > 0) {
        const req = data[0];
        const section = document.getElementById('activationSection');
        section.style.display = 'block';

        document.getElementById('activationCodeDisplay').textContent = req.activation_code;

        const expiry = new Date(req.expiry_date);
        const now = new Date();

        let statusText = '';
        let statusClass = '';
        let remainingText = '';

        if (req.status === 'pending') {
          statusText = '⏳ في الانتظار';
          statusClass = 'status-pending';
          remainingText = 'بانتظار موافقة الأدمن';
        } else if (req.status === 'active' && expiry > now) {
          statusText = '✅ نشط';
          statusClass = 'status-active';
          const diff = expiry - now;
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          remainingText = `${days} يوم و ${hours} ساعة`;
        } else {
          statusText = '❌ منتهي';
          statusClass = 'status-expired';
          remainingText = 'انتهت صلاحية الكود';
        }

        document.getElementById('activationStatusDisplay').textContent = statusText;
        document.getElementById('activationStatusDisplay').className = 'status ' + statusClass;
        document.getElementById('activationRemainingDisplay').textContent = remainingText;

      } else {
        document.getElementById('activationSection').style.display = 'none';
      }

    } catch (e) {
      console.error('خطأ:', e);
    }
  }

  window.onload = function() {
    const userData = localStorage.getItem('dorak_user');
    if (!userData) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const user = JSON.parse(userData);
      document.getElementById('userName').textContent = user.name || 'مستخدم';
      document.getElementById('userEmail').textContent = user.email || '';

      if (user.picture) {
        const container = document.getElementById('avatarContainer');
        container.innerHTML = `<img src="${user.picture}" alt="Profile" />`;
      }

      loadActivationStatus();

    } catch (e) {
      window.location.href = 'login.html';
    }
  };
</script>

</body>
</html>
