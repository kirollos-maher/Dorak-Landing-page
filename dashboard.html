<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DORAK — لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0c0f12;
      color: #eef1f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(600px 400px at 80% 20%, rgba(255, 138, 30, 0.10), transparent 60%);
      padding: 20px;
    }
    .dashboard-card {
      background: #14181d;
      border: 1px solid #262c33;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .dashboard-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 138, 30, 0.06), transparent 50%);
      pointer-events: none;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .02em;
      margin-bottom: 32px;
      color: #eef1f4;
    }
    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff8a1e;
      box-shadow: 0 0 0 4px rgba(255, 138, 30, 0.12);
    }
    .brand .mark {
      font-family: 'JetBrains Mono', monospace;
      color: #ff8a1e;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #262c33;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      color: #ff8a1e;
      border: 2px solid #ff8a1e;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dashboard-card h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .dashboard-card .email {
      color: #8b95a1;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .dashboard-card .badge {
      display: inline-block;
      background: rgba(45, 212, 191, 0.15);
      color: #2dd4bf;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 28px;
    }
    .btn-logout {
      width: 100%;
      background: transparent;
      border: 1px solid #ef4444;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #ef4444;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-top: 10px;
    }
    .btn-logout:hover {
      background: #ef4444;
      color: #0c0f12;
    }
    .btn-home {
      width: 100%;
      background: #ff8a1e;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #12100c;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .btn-home:hover {
      background: #f57c0a;
    }
    .btn-trial {
      width: 100%;
      background: transparent;
      border: 1px solid #22c55e;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #22c55e;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .btn-trial:hover {
      background: #22c55e;
      color: #0c0f12;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 11px;
      color: #3a424c;
      border-top: 1px solid #1e242b;
      padding-top: 18px;
    }
    .footer-note a { color: #565f6a; text-decoration: none; }
    .footer-note a:hover { color: #8b95a1; }
    @media (max-width: 480px) {
      .dashboard-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

<div class="dashboard-card" id="dashboardCard">
  <div class="brand">
    <span class="dot"></span>
    DORAK <span class="mark">✦</span>
  </div>

  <div class="avatar" id="avatarContainer">
    <i class="fa-regular fa-user"></i>
  </div>

  <h2 id="userName">مرحباً بك!</h2>
  <p class="email" id="userEmail">example@email.com</p>
  <div class="badge">✅ تم تسجيل الدخول بنجاح</div>

  <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> العودة للصفحة الرئيسية</a>
  
  <a href="index.html" class="btn-trial"><i class="fa-solid fa-rocket"></i> ابدأ تجربتك المجانية دلوقتي</a>

  <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>

  <div class="footer-note">
    <span>© 2026 DORAK — نظام إدارة صالات البلايستيشن والجيمنج</span>
  </div>
</div>

<script>
  function logout() {
    localStorage.removeItem('dorak_user');
    window.location.href = 'login.html';
  }

  window.onload = function() {
    const userData = localStorage.getItem('dorak_user');
    if (!userData) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const user = JSON.parse(userData);
      document.getElementById('userName').textContent = user.name || 'مستخدم';
      document.getElementById('userEmail').textContent = user.email || '';

      if (user.picture) {
        const container = document.getElementById('avatarContainer');
        container.innerHTML = `<img src="${user.picture}" alt="Profile" />`;
      }
    } catch (e) {
      window.location.href = 'login.html';
    }
  };
</script>

</body>
</html>
