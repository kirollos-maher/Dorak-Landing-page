<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DORAK — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0c0f12;
      color: #eef1f4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(600px 400px at 80% 20%, rgba(255, 138, 30, 0.10), transparent 60%);
      padding: 20px;
    }
    .login-card {
      background: #14181d;
      border: 1px solid #262c33;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 138, 30, 0.06), transparent 50%);
      pointer-events: none;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #8b95a1;
      font-size: 28px;
      text-decoration: none;
      z-index: 10;
      transition: color 0.2s;
    }
    .close-btn:hover { color: #eef1f4; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .02em;
      margin-bottom: 32px;
      color: #eef1f4;
    }
    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff8a1e;
      box-shadow: 0 0 0 4px rgba(255, 138, 30, 0.12);
    }
    .brand .mark {
      font-family: 'JetBrains Mono', monospace;
      color: #ff8a1e;
    }
    .login-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .login-card .sub { color: #8b95a1; font-size: 14px; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #8b95a1;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: #0c0f12;
      border: 1px solid #262c33;
      border-radius: 10px;
      padding: 14px 16px;
      color: #eef1f4;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #ff8a1e;
      box-shadow: 0 0 0 3px rgba(255, 138, 30, 0.15);
    }
    .password-strength {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      font-size: 12px;
      color: #565f6a;
    }
    .password-strength .bar {
      flex: 1;
      height: 4px;
      background: #262c33;
      border-radius: 4px;
      overflow: hidden;
    }
    .password-strength .bar .fill {
      width: 60%;
      height: 100%;
      background: #ff8a1e;
      border-radius: 4px;
    }
    .btn-login {
      width: 100%;
      background: #ff8a1e;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-weight: 800;
      font-size: 16px;
      color: #12100c;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 18px rgba(255, 138, 30, 0.3);
      margin-top: 6px;
    }
    .btn-login:hover { background: #f57c0a; box-shadow: 0 8px 28px rgba(255, 138, 30, 0.5); }
    .btn-login:active { transform: scale(0.97); }
    .login-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-size: 14px;
    }
    .login-footer a { color: #ff8a1e; font-weight: 700; text-decoration: none; }
    .login-footer a:hover { text-decoration: underline; }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 26px 0 20px;
      color: #565f6a;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #262c33;
    }
    .btn-google-wrapper { width: 100%; display: flex; justify-content: center; }
    .btn-google-wrapper > div { width: 100% !important; max-width: 100% !important; }
    .btn-google-custom {
      width: 100%;
      background: transparent;
      border: 1px solid #262c33;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 15px;
      color: #eef1f4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    .btn-google-custom:hover { background: #1e242b; border-color: #3a424c; }
    .btn-google-custom i { font-size: 20px; color: #fff; }
    .legal {
      margin-top: 28px;
      font-size: 11.5px;
      color: #565f6a;
      text-align: center;
      line-height: 1.6;
      border-top: 1px solid #1e242b;
      padding-top: 22px;
    }
    .legal strong { color: #8b95a1; }
    .legal .brand-tag { color: #ff8a1e; font-weight: 700; }
    .footer-note {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      font-size: 11px;
      color: #3a424c;
      gap: 14px;
    }
    .footer-note a { color: #565f6a; text-decoration: none; }
    .footer-note a:hover { color: #8b95a1; }
    #g_id_onload { display: none; }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
      text-align: center;
    }
    @media (max-width: 480px) {
      .login-card { padding: 32px 20px; }
      .brand { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- زر الرجوع X -->
  <a href="index.html" class="close-btn"><i class="fa-solid fa-xmark"></i></a>
  
  <div class="brand">
    <span class="dot"></span>
    DORAK <span class="mark">✦</span>
  </div>
  
  <h2>تسجيل الدخول</h2>
  <p class="sub">أدخل بيانات حسابك للدخول إلى لوحة تحكم دورك</p>

  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="name@example.com" required />
    </div>
    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <div class="password-strength">
        <span>نسبة كلمة المرور</span>
        <div class="bar"><div class="fill"></div></div>
      </div>
    </div>
    <div id="loginError" class="error-msg"></div>
    <button type="submit" class="btn-login"><i class="fa-solid fa-arrow-right"></i> دخول</button>
  </form>

  <div class="login-footer">
    <a href="register.html">إنشاء حساب جديد</a>
    <a href="reset-password.html" style="color:#565f6a; font-weight:400;">نسيت كلمة المرور؟</a>
  </div>

  <div class="divider">أو</div>

  <div id="googleBtnContainer" class="btn-google-wrapper" style="margin-bottom: 10px;"></div>
  <button id="googleFallbackBtn" class="btn-google-custom" onclick="handleGoogleFallback()">
    <i class="fa-brands fa-google"></i>
    <span>تسجيل الدخول عبر Google</span>
  </button>
  <p id="googleStatus" style="font-size: 11px; color: #565f6a; margin-top: 6px; text-align: center;"></p>

  <div class="legal">
    <strong>DORAK</strong> — نظام إدارة صالات البلايستيشن والجيمنج.<br />
    <span class="brand-tag">دورك</span> مش تابع لأي شركة ألعاب خارجية.
  </div>
  <div class="footer-note">
    <span>© 2026 DORAK</span>
    <span>نظام إدارة صالات البلايستيشن والجيمنج</span>
    <a href="#">حذف البيانات</a>
  </div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyA5snSgN-BAdcYMPvFRpIxRiMGHkX8VA2Y",
    authDomain: "dorakdb-0.firebaseapp.com",
    databaseURL: "https://dorakdb-0-default-rtdb.firebaseio.com",
    projectId: "dorakdb-0",
    storageBucket: "dorakdb-0.firebasestorage.app",
    messagingSenderId: "543545007670",
    appId: "1:543545007670:web:78f6e765e72006d98b4297"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const GOOGLE_CLIENT_ID = '174155373036-pu72hfnfd5e8q7j2fiq2v5pevscsth1t.apps.googleusercontent.com';

  function getUsersFromDB() {
    return new Promise((resolve) => {
      db.ref('users').once('value').then((snapshot) => {
        const data = snapshot.val();
        if (data) {
          const usersArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
          resolve(usersArray);
        } else {
          resolve([]);
        }
      }).catch(() => resolve([]));
    });
  }

  async function findUserByEmail(email) {
    const users = await getUsersFromDB();
    return users.find(u => u.email === email) || null;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';

    if (!email || !password) {
      errorEl.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور.';
      errorEl.style.display = 'block';
      return false;
    }

    const user = await findUserByEmail(email);

    if (!user || user.password !== password) {
      errorEl.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      errorEl.style.display = 'block';
      return false;
    }

    const session = {
      name: user.name,
      email: user.email,
      picture: user.picture || null
    };
    localStorage.setItem('dorak_user', JSON.stringify(session));
    window.location.href = 'dashboard.html';
    return false;
  }

  function handleGoogleFallback() {
    document.getElementById('googleStatus').innerHTML = '⏳ جاري الاتصال بـ Google...';
    setTimeout(() => {
      const user = {
        name: 'مستخدم Google',
        email: 'user_google@gmail.com',
        picture: null
      };
      localStorage.setItem('dorak_user', JSON.stringify(user));
      window.location.href = 'dashboard.html';
    }, 1200);
  }

  window.onload = function() {
    if (localStorage.getItem('dorak_user')) {
      window.location.href = 'dashboard.html';
      return;
    }

    const container = document.getElementById('googleBtnContainer');
    const fallbackBtn = document.getElementById('googleFallbackBtn');
    const statusEl = document.getElementById('googleStatus');

    if (GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.length > 10) {
      fallbackBtn.style.display = 'none';
      statusEl.textContent = '🔐 تسجيل آمن عبر Google';

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: (response) => {
          const payload = JSON.parse(atob(response.credential.split('.')[1]));
          const user = {
            name: payload.name || payload.email?.split('@')[0] || 'مستخدم',
            email: payload.email || '',
            picture: payload.picture || null
          };
          localStorage.setItem('dorak_user', JSON.stringify(user));
          window.location.href = 'dashboard.html';
        },
        cancel_on_tap_outside: false,
      });

      google.accounts.id.renderButton(container, {
        theme: 'outline',
        size: 'large',
        width: 400,
        text: 'signin_with',
        shape: 'rectangular',
        logo_alignment: 'left'
      });
    } else {
      fallbackBtn.style.display = 'flex';
      statusEl.textContent = '💡 لتفعيل الدخول بجوجل حقيقي، ضع Client ID في الكود';
    }
  };
</script>

</body>
</html>
