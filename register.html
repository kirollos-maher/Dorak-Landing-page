<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DORAK — تسجيل سريع</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0c0f12;
      color: #eef1f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #14181d;
      border: 1px solid #262c33;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #0c0f12;
      border: 1px solid #262c33;
      border-radius: 8px;
      color: #eef1f4;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #ff8a1e;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 18px;
      color: #12100c;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover { background: #f57c0a; }
    #result { margin-top: 16px; font-weight: 700; }
  </style>
</head>
<body>
<div class="card">
  <h1>📝 تسجيل حساب جديد</h1>
  <input type="text" id="name" placeholder="الاسم الكامل" />
  <input type="email" id="email" placeholder="البريد الإلكتروني" />
  <input type="password" id="pass" placeholder="كلمة المرور" />
  <button onclick="register()">إنشاء حساب</button>
  <div id="result"></div>
  <p style="margin-top:20px;font-size:14px;color:#565f6a;">
    <a href="login.html" style="color:#ff8a1e;">لديك حساب؟ سجل الدخول</a>
  </p>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA5snSgN-BAdcYMPvFRpIxRiMGHkX8VA2Y",
    authDomain: "dorakdb-0.firebaseapp.com",
    databaseURL: "https://dorakdb-0-default-rtdb.firebaseio.com",
    projectId: "dorakdb-0",
    storageBucket: "dorakdb-0.firebasestorage.app",
    messagingSenderId: "543545007670",
    appId: "1:543545007670:web:78f6e765e72006d98b4297"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function register() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    const result = document.getElementById('result');

    if (!name || !email || !pass) {
      result.innerHTML = '❌ املأ جميع الحقول';
      result.style.color = '#ef4444';
      return;
    }
    if (pass.length < 6) {
      result.innerHTML = '❌ كلمة المرور 6 أحرف على الأقل';
      result.style.color = '#ef4444';
      return;
    }

    result.innerHTML = '⏳ جاري التسجيل...';
    result.style.color = '#ff8a1e';

    db.ref('users').push({
      name: name,
      email: email,
      password: pass,
      createdAt: new Date().toISOString()
    })
    .then(() => {
      result.innerHTML = '✅ تم التسجيل بنجاح! جاري التحويل...';
      result.style.color = '#22c55e';
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    })
    .catch((err) => {
      result.innerHTML = '❌ خطأ: ' + err.message;
      result.style.color = '#ef4444';
    });
  }
</script>
</body>
</html>
